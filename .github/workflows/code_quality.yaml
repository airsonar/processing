name: Code quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  reuse:
    name: Check REUSE compliance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: fsfe/reuse-action@v6


  ruff:
    name: Check code style
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v7

      - name: Check code formatting
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "format --check --diff"

        # The default is run `ruff check`
      - name: Check code style
        uses: astral-sh/ruff-action@v4.1.0


  typehinting:
    name: Check static type hinting
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install package
        run: uv pip install mypy -e .[tests] scipy-stubs
        env:
          UV_SYSTEM_PYTHON: 1

      - name: Check package code
        run: mypy -p airsonar.processing

      - name: Check unit tests
        if: always()  # Even if there were errors in the package code
        run: mypy tests/
