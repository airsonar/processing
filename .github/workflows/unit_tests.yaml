name: Unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  latest:
    name: Latest dependencies for supported Python versions
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install package
        run: uv pip install mypy -e .[tests]
        env:
          UV_SYSTEM_PYTHON: 1

      - name: Run unit tests
        run: pytest --cov-report=xml


  windows:
    name: Run tests under Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install package
        run: uv pip install mypy -e .[tests]
        env:
          UV_LINK_MODE: copy  # Stop the warning as cache and env are on separate drives
          UV_SYSTEM_PYTHON: 1

      - name: Run unit tests
        run: pytest --cov-report=xml
